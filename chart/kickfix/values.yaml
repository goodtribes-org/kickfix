frontend:
  image:
    repository: ghcr.io/goodtribes-org/kickfix/frontend
    tag: main
  replicaCount: 1
  service:
    port: 3000
  env:
    REACT_APP_API_URL: "https://api.kickfix.se/api"

backend:
  image:
    repository: ghcr.io/goodtribes-org/kickfix/backend
    tag: main
  replicaCount: 1
  service:
    port: 5000
  env:
    FRONTEND_URL: "https://www.kickfix.se,https://kickfix.se"
    PORT: "5000"
    NODE_ENV: "production"
  # JWT_SECRET lives in a Kubernetes Secret, never in this file or the rendered
  # manifest. The Secret is created out-of-band (see chart/kickfix/README.md);
  # ArgoCD does not manage it, so a sync can never overwrite or prune it.
  secret:
    name: kickfix-backend-secrets
    # Leave false in GitOps. Only flip it for a `helm install` that should
    # create the Secret itself, and then pass --set backend.secret.jwtSecret=...
    create: false
    jwtSecret: ""
  uploads:
    size: 1Gi

mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "7"
  storage:
    size: 5Gi
  auth:
    enabled: false

ingress:
  enabled: true
  frontendHosts:
    - www.kickfix.se
    - kickfix.se
  backendHost: api.kickfix.se
  tls:
    enabled: true

imagePullSecrets:
  - name: ghcr-pull-secret
