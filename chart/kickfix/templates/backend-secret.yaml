{{- if .Values.backend.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backend.secret.name }}
  labels:
    app: {{ .Release.Name }}-backend
  annotations:
    # Survive `helm uninstall` and never get pruned by an ArgoCD sync.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
stringData:
  JWT_SECRET: {{ required "backend.secret.jwtSecret is required when backend.secret.create is true" .Values.backend.secret.jwtSecret | quote }}
{{- end }}
